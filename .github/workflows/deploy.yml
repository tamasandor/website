name: CI/CD Pipeline

on:
    push:
        branches: [ "main" ]

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v7

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4

          - name: Generate Dummy SSL Certificates for CI
            run: |
              mkdir -p ./certs/live/tamasandor.de
              mkdir -p ./certs/acme-challenge
              openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                -keyout ./certs/live/tamasandor.de/privkey.pem \
                -out ./certs/live/tamasandor.de/fullchain.pem \
                -subj "/CN=tamasandor.de"

          - name: Build and Start Portfolio Only
            run: docker compose up -d --build portfolio

          - name: Verify Portfolio is Running
            run: |
              sleep 5
              STATES=$(docker compose ps portfolio --format '{{.State}}')
              RUNNING_COUNT=$(echo "$STATES" | grep -c "^running$" || true)
              echo "Found $RUNNING_COUNT running container."
              if [ "$RUNNING_COUNT" -lt 1 ]; then
                echo "--- Error Logs ---"
                docker compose logs portfolio
              exit 1
              fi
              echo "Container is running successfully!"

    deploy:
      needs: test-and-build
      runs-on: ubuntu-latest
      steps:
        - name: Deploy
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.SERVER_HOST }}
            port: ${{ secrets.SERVER_PORT }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}