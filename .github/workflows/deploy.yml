name: CI/CD Pipeline

on:
    push:
        branches: [ "main" ]

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4

          - name: Buld and Start Containers
            run: docker compose up -d --build

          - name: Verify Containers are Running
            run: |
              sleep 5
              STATES=$(docker compose ps --format '{{.State}}')
              RUNNING_COUNT=$(echo "$STATES" | grep -c "^running$" || true)
              echo "Found $RUNNING_COUNT / 2 running containers."
              if [ "$RUNNING_COUNT" -ne 2 ]; then
                echo "Error: Expected 2 running containers, but found $RUNNING_COUNT!" >&2
                echo "--- Container States ---"
                echo "$STATES"
                echo "--- Container Logs ---"
                docker compose logs
              exit 1
              fi
              echo "Both containers are running successfully!"

    deploy:
      needs: test-and-build
      runs-on: ubuntu-latest
      steps:
        - name: Deploy
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.SERVER_HOST }}
            port: ${{ secrets.SERVER_PORT }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}